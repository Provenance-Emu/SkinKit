name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: swift test (macOS host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  simulator:
    name: test (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, tvos]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: scripts/ci-test.sh ${{ matrix.platform }}
