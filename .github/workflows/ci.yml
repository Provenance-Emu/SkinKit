name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Xcode the apps (Provenance, iFly, iCube) build with.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  agent-tests:
    name: Codex trigger tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/codex-context.test.cjs

  host:
    name: swift test (macOS host)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
        env:
          SKIN2_FAILURES: ${{ runner.temp }}/skin2-render-failures
      - name: Upload Swift renderer diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skin2-swift-render-diffs
          path: ${{ runner.temp }}/skin2-render-failures/
          if-no-files-found: ignore

  simulator:
    name: test (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, tvos]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: scripts/ci-test.sh ${{ matrix.platform }}
